name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux-amd64:
    name: Build Linux amd64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build Web UI
        run: cd web && npm ci && npm run build

      - name: Build binary
        run: make build-release-linux-amd64

      - name: Package archive
        run: |
          mkdir -p release-staging
          cp bin/local-text-history-linux-amd64 release-staging/local-text-history
          cp config.example.json release-staging/
          cp local-text-history.service release-staging/
          tar -czf local-text-history-${{ github.ref_name }}-linux-amd64.tar.gz -C release-staging .
          cp local-text-history-${{ github.ref_name }}-linux-amd64.tar.gz local-text-history-linux-amd64.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: local-text-history-linux-amd64
          path: |
            local-text-history-${{ github.ref_name }}-linux-amd64.tar.gz
            local-text-history-linux-amd64.tar.gz

  build-linux-arm64:
    name: Build Linux arm64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install cross-compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build Web UI
        run: cd web && npm ci && npm run build

      - name: Build binary
        run: make build-release-linux-arm64

      - name: Package archive
        run: |
          mkdir -p release-staging
          cp bin/local-text-history-linux-arm64 release-staging/local-text-history
          cp config.example.json release-staging/
          cp local-text-history.service release-staging/
          tar -czf local-text-history-${{ github.ref_name }}-linux-arm64.tar.gz -C release-staging .
          cp local-text-history-${{ github.ref_name }}-linux-arm64.tar.gz local-text-history-linux-arm64.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: local-text-history-linux-arm64
          path: |
            local-text-history-${{ github.ref_name }}-linux-arm64.tar.gz
            local-text-history-linux-arm64.tar.gz

  build-darwin-arm64:
    name: Build macOS arm64
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build Web UI
        run: cd web && npm ci && npm run build

      - name: Build binary
        run: make build-release-darwin-arm64

      - name: Package archive
        run: |
          mkdir -p release-staging
          cp bin/local-text-history-darwin-arm64 release-staging/local-text-history
          cp config.example.json release-staging/
          tar -czf local-text-history-${{ github.ref_name }}-darwin-arm64.tar.gz -C release-staging .
          cp local-text-history-${{ github.ref_name }}-darwin-arm64.tar.gz local-text-history-darwin-arm64.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: local-text-history-darwin-arm64
          path: |
            local-text-history-${{ github.ref_name }}-darwin-arm64.tar.gz
            local-text-history-darwin-arm64.tar.gz

  release:
    name: Create Release
    needs: [build-linux-amd64, build-linux-arm64, build-darwin-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            artifacts/local-text-history-linux-amd64/local-text-history-${{ github.ref_name }}-linux-amd64.tar.gz \
            artifacts/local-text-history-linux-amd64/local-text-history-linux-amd64.tar.gz \
            artifacts/local-text-history-linux-arm64/local-text-history-${{ github.ref_name }}-linux-arm64.tar.gz \
            artifacts/local-text-history-linux-arm64/local-text-history-linux-arm64.tar.gz \
            artifacts/local-text-history-darwin-arm64/local-text-history-${{ github.ref_name }}-darwin-arm64.tar.gz \
            artifacts/local-text-history-darwin-arm64/local-text-history-darwin-arm64.tar.gz
